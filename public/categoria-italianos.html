<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITALIANOS | The Garage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/categoria.css">
</head>

<body>
  <!-- NAV -->
  <div id="navbar-container"></div>

  <!-- HERO CATEGORIA -->
  <section class="cat-hero" data-categoria="italianos">
    <div class="cat-hero__bg"></div>
    <div class="container cat-hero__content">
      <div class="cat-hero__texto">
        <span class="cat-hero__flag">IT</span>
        <h1 class="cat-hero__titulo">ITALIANOS</h1>
        <p class="cat-hero__sub">Elegance & Speed - Dirija os carros mais elegantes do mundo.</p>
        <div class="cat-hero__stats">
          <div class="cat-stat"><span class="cat-stat__num" id="catTotalProd">0</span><span class="cat-stat__label">Produtos</span></div>
          <div class="cat-stat"><span class="cat-stat__num">⭐ 4.9</span><span class="cat-stat__label">Avaliação</span></div>
        </div>
      </div>

      <!-- CARROSSEL DESTAQUES -->
      <div class="cat-hero__carrossel">
        <div class="carrossel-wrapper" id="carrosselCatHero">
          <div class="carrossel-track" id="trackCatHero"></div>
          <button class="carrossel-btn carrossel-btn--prev" id="prevCatHero"><i class="fas fa-chevron-left"></i></button>
          <button class="carrossel-btn carrossel-btn--next" id="nextCatHero"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
    </div>
  </section>

  <!-- MAIN -->
  <main class="cat-main">
    <div class="container">
      <div class="cat-layout">

        <!-- SIDEBAR -->
        <aside class="cat-filtros" id="catFiltros">
          <div class="cat-filtros__header">
            <h3>Filtros</h3>
            <button class="btn btn-outline btn-sm" id="btnLimparFiltros">Limpar</button>
          </div>

          <!-- BUSCA -->
          <div class="filtro-bloco">
            <p class="filtro-titulo">Buscar</p>
            <input type="text" class="input-field" id="filtroTexto" placeholder="Nome do produto...">
          </div>

          <!-- PREÇO -->
          <div class="filtro-bloco">
            <p class="filtro-titulo">Faixa de Preço</p>
            <div class="filtro-preco-range">
              <div class="input-grupo" style="margin-bottom:0.5rem;">
                <label>Mínimo</label>
                <input type="number" class="input-field" id="filtroPrecoMin" placeholder="R$ 0">
              </div>
              <div class="input-grupo" style="margin-bottom:0;">
                <label>Máximo</label>
                <input type="number" class="input-field" id="filtroPrecoMax" placeholder="R$ 99.999">
              </div>
            </div>
          </div>

          <!-- DISPONIBILIDADE -->
          <div class="filtro-bloco">
            <p class="filtro-titulo">Disponibilidade</p>
            <div class="filtro-checks">
              <label class="checkbox-label">
                <input type="checkbox" id="filtroDisponivel" checked>
                <span class="checkbox-custom"></span>
                Em estoque
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="filtroNovos">
                <span class="checkbox-custom"></span>
                Novidades
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="filtroOfertas">
                <span class="checkbox-custom"></span>
                Em oferta
              </label>
            </div>
          </div>

          <!-- ORDENAÇÃO -->
          <div class="filtro-bloco">
            <p class="filtro-titulo">Ordenar por</p>
            <select class="input-field" id="filtroOrdem">
              <option value="relevancia">Relevância</option>
              <option value="menor-preco">Menor preço</option>
              <option value="maior-preco">Maior preço</option>
              <option value="novidade">Novidades</option>
              <option value="mais-vendidos">Mais vendidos</option>
            </select>
          </div>

          <button class="btn btn-primario w-100" id="btnAplicarFiltros">Aplicar Filtros</button>
        </aside>

        <!-- GRID DE PRODUTOS -->
        <div class="cat-produtos-area">

          <!-- BARRA DE RESULTADOS -->
          <div class="cat-resultados-bar">
            <span class="texto-muted texto-pequeno" id="contadorResultados">0 produtos encontrados</span>
          </div>

          <!-- PRODUTOS VIS JS -->
          <div class="grid-produtos" id="catProdutosGrid">
          </div>

          <!-- PAGINAÇÃO -->
          <div class="paginacao" id="catPaginacao">
            <button class="paginacao__btn ativo">1</button>
            <button class="paginacao__btn">2</button>
            <button class="paginacao__btn">3</button>
            <span class="texto-muted">...</span>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <p class="footer__copy">© 2026 TheGarage. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="global.js"></script>
  <script src="categoria.js"></script>
</body>

</html>
