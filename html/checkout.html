<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | The Garage</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/checkout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <span class="navbar__logo-icon"></span>
        <div><span class="navbar__logo-texto">THE<span>GARAGE</span></span><span class="navbar__logo-sub">Tuning & Performance</span></div>
      </a>
      <div class="navbar__acoes">
        <a href="carrinho.html" class="navbar__icon-btn"><i class="fas fa-box-open"></i><span class="navbar__badge" id="carrinhoCount" style="display:none">0</span></a>
        <a href="perfil.html" class="navbar__icon-btn"><i class="fas fa-user"></i></a>
      </div>
      <button class="navbar__toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <div class="navbar-spacer"></div>

  <div class="checkout-progresso">
    <div class="container">
      <div class="checkout-steps">
        <div class="checkout-step concluido"><i class="fas fa-box-open"></i> Carrinho</div>
        <div class="checkout-step__sep"><i class="fas fa-chevron-right"></i></div>
        <div class="checkout-step ativo"><i class="fas fa-credit-card"></i> Checkout</div>
        <div class="checkout-step__sep"><i class="fas fa-chevron-right"></i></div>
        <div class="checkout-step"> <i class="fas fa-check"></i> Confirmação</div>
      </div>
    </div>
  </div>

  <main class="checkout-main">
    <div class="container">
      <div class="checkout-layout">

        <div class="checkout-form-area">
          <div class="checkout-bloco">
            <div class="checkout-bloco__titulo"><span class="checkout-bloco__num">01</span><h2>Endereço de Entrega</h2></div>
            <div class="enderecos-radio" id="enderecosRadio">
              <p class="texto-muted">Carregando seus endereços...</p>
            </div>
            <button class="btn btn-outline btn-sm mt-2" id="btnNovoEnderecoCheckout">+ Novo Endereço</button>

            <!-- Opções de frete -->
            <div class="frete-opcoes" style="margin-top:1.5rem;">
              <p class="checkout-sublabel">Forma de Entrega</p>
              <label class="frete-opcao">
                <input type="radio" name="frete" value="pac" checked>
                <div class="frete-info">
                  <span><i class="fas fa-box"></i> PAC</span>
                  <span class="texto-muted">5-10 dias úteis</span>
                </div>
                <span class="frete-preco">Grátis</span>
              </label>
              <label class="frete-opcao">
                <input type="radio" name="frete" value="sedex">
                <div class="frete-info">
                  <span><i class="fas fa-bolt"></i> SEDEX</span>
                  <span class="texto-muted">1-3 dias úteis</span>
                </div>
                <span class="frete-preco">R$ 29,90</span>
              </label>
            </div>
          </div>

          <div class="checkout-bloco">
            <div class="checkout-bloco__titulo"><span class="checkout-bloco__num">02</span><h2>Pagamento</h2></div>
            <div class="cartoes-radio" id="cartoesRadio">
              <p class="checkout-sublabel">Cartões Salvos</p>

              <label class="cartao-radio-item">
                <input type="radio" name="cartao" value="4242" checked>
                <span class="cartao-radio-flag"><i class="fas fa- fa-credit-card"></i></span>
                <div class="cartao-radio-info">
                  <span>•••• •••• •••• 4242</span>
                  <span class="texto-muted texto-pequeno">VISA - Vence 12/26</span>
                </div>
                <div class="cartao-radio-check"></div>
              </label>

              <label class="cartao-radio-item">
                <input type="radio" name="cartao" value="5555">
                <span class="cartao-radio-flag"><i class="fas fa- fa-credit-card"></i></span>
                <div class="cartao-radio-info">
                  <span>•••• •••• •••• 5555</span>
                  <span class="texto-muted texto-pequeno">MASTERCARD - Vence 03/25</span>
                </div>
                <div class="cartao-radio-check"></div>
              </label>

              <!-- Novo cartão -->
              <label class="cartao-radio-item">
                <input type="radio" name="cartao" value="novo">
                <span class="cartao-radio-flag"><i class="fas fa-plus"></i></span>
                <div class="cartao-radio-info">
                  <span>Adicionar novo cartão</span>
                </div>
                <div class="cartao-radio-check"></div>
              </label>
            </div>

            <div class="novo-cartao-form" id="novoCartaoForm" style="display:none; margin-top:1rem; padding:1.25rem;">
              <div class="input-grupo">
                <label>Número do Cartão</label>
                <input type="text" class="input-field" id="checkoutCartaoNum" maxlength="19">
              </div>
              <div class="input-grupo">
                <label>Nome no Cartão</label>
                <input type="text" class="input-field" placeholder="Como está no cartão">
              </div>
              <div class="form-grid-2">
                <div class="input-grupo">
                  <label>Validade</label>
                  <input type="text" class="input-field" placeholder="MM/AA" maxlength="5">
                </div>
                <div class="input-grupo">
                  <label>CVV</label>
                  <input type="text" class="input-field" placeholder="•••" maxlength="4">
                </div>
              </div>
            </div>

            <!-- PIX -->
            <div class="pix-opcao" style="margin-top:1rem;">
              <label class="cartao-radio-item">
                <input type="radio" name="cartao" value="pix">
                <span class="cartao-radio-flag"><i class="fas fa-dollar"></i></span>
                <div class="cartao-radio-info">
                  <span>PIX</span>
                  <span class="texto-muted texto-pequeno">5% de desconto + aprovação imediata</span>
                </div>
                <div class="cartao-radio-check"></div>
              </label>
            </div>

            <!-- Múltiplos cartões (área futura) -->
            <div class="multiplos-cartoes-hint" style="margin-top:1rem; padding:0.75rem; border:1px dashed rgba(0,255,136,0.15); border-radius:var(--radius-padrao);">
              <span class="texto-muted texto-pequeno"> <i class="fas fa-lightbulb"></i> Em breve: dividir pagamento em múltiplos cartões</span>
            </div>
          </div>

          <div class="checkout-bloco">
            <div class="checkout-bloco__titulo"><span class="checkout-bloco__num">03</span><h2>Cupom</h2></div>
            <div class="cupom-input">
              <input type="text" class="input-field" id="checkoutCupom" style="text-transform:uppercase">
              <button class="btn btn-outline" id="btnAplicarCupomCheckout">Aplicar</button>
            </div>
            <div id="checkoutCupomFeedback" style="margin-top:0.5rem; display:none;"></div>
          </div>
        </div>

        <div class="checkout-resumo">
          <h2>Resumo do Pedido</h2>
          <div class="checkout-itens" id="checkoutItens"></div>
          <div class="divider"></div>
          <div class="checkout-resumo-calc" id="checkoutCalc"></div>
          <div class="divider"></div>
          <button class="btn btn-primario btn-lg w-100" id="btnConfirmarPedido">
            <span id="btnConfTexto">Confirmar Pedido</span>
            <span id="btnConfLoad" style="display:none"><span class="spinner"></span></span>
          </button>

          <p class="checkout-seguro">
            <i class="fas fa-lock"></i> Pagamento 100% seguro e criptografado
          </p>
        </div>

      </div>
    </div>
  </main>

  <script src="../js/public/global.js"></script>
  <script src="../js/public/checkout.js"></script>
</body>
</html>
