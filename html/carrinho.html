<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho | The Garage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/carrinho.css">
</head>
<body>
  <!-- NAVBAR -->
  <div id="navbar-container"></div>

  <main class="carrinho-main">
    <div class="container">

      <div class="carrinho-header">
        <h1><i class="fas fa-box-open"></i> Carrinho de Compras</h1>
        <!-- Aviso de bloqueio de estoque (futuro: temporizador real) -->
        <div class="alerta alerta-aviso carrinho-aviso-bloqueio" id="avisoBloqueio" style="display:none">
          <i class="fas fa-clock"></i><strong>Atenção:</strong> Seus itens estão reservados por <span id="timerBloqueio">15:00</span>.
          Após esse tempo, o estoque poderá ser liberado para outros clientes.
        </div>
      </div>

      <!-- Layout: itens + resumo -->
      <div class="carrinho-layout" id="carrinhoLayout">

        <!-- Lista de itens -->
        <div class="carrinho-itens" id="carrinhoItens">
          <!-- Renderizado por JS -->
        </div>

        <!-- Resumo do pedido -->
        <div class="carrinho-resumo">
          <h2>Resumo do Pedido</h2>

          <div class="resumo-linhas" id="resumoLinhas">
            <!-- Gerado via JS -->
          </div>

          <div class="divider"></div>

          <div class="resumo-total" id="resumoTotal">
            <!-- Gerado via JS -->
          </div>

          <div class="divider"></div>

          <!-- Campo de cupom -->
          <div class="carrinho-cupom">
            <label class="input-grupo" style="margin-bottom:0;">
              <span style="font-family:var(--fonte-destaque);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--cor-texto-muted);">Cupom de Desconto</span>
            </label>
            <div class="cupom-input">
              <input type="text" class="input-field" id="cupomInput" placeholder="Digite o cupom..." maxlength="20" style="text-transform:uppercase">
              <button class="btn btn-outline btn-sm" id="btnAplicarCupom">Aplicar</button>
            </div>
            <div id="cupomFeedback" style="display:none; margin-top:0.5rem;"></div>
          </div>

          <div class="divider"></div>

          <a href="checkout.html" class="btn btn-primario btn-lg w-100" id="btnFinalizarCompra">
            Finalizar Compra →
          </a>
          <a href="index.html" class="btn btn-outline w-100 mt-1" style="margin-top:0.75rem;">
            ← Continuar Comprando
          </a>

          <!-- Área de notificação de expiração (futuro: WebSocket/SSE) -->
          <!-- data-futuro="notificacao-expiracao-carrinho" -->
          <div id="notificacaoExpiracao" style="display:none; margin-top:1rem;"></div>
        </div>

      </div>

      <!-- Estado vazio -->
      <div class="carrinho-vazio" id="carrinhoVazio" style="display:none">
        <div class="carrinho-vazio__icon">🛒</div>
        <h2>Seu carrinho está vazio</h2>
        <p>Que tal adicionar algumas peças?</p>
        <a href="index.html" class="btn btn-primario mt-2">Explorar Produtos</a>
      </div>

    </div>
  </main>

  <script src="../js/public/global.js"></script>
  <script src="../js/public/carrinho.js"></script>
</body>
</html>
